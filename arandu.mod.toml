# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/onnx"
framework = ">= 0.50"
profiles = ["conventional", "performance"]

[permissions]
# It answers no request and opens no connection. Nothing leaves the process.
network = false
# It reads model files and their calibration tables from the directory the
# application names, and checks that the shared library it was told to load
# exists. With TensorRT configured it also creates, under the cache directory
# the application names, one private directory per model and writes into it
# the verified copy of the model's calibration table, which is where TensorRT
# reads it; TensorRT writes its engines and timing cache there. It writes
# nothing anywhere else. The calibration command in cmd/ writes the table it
# is told to, and is not linked into an application.
filesystem = true
# It runs no other program. It does link one: ONNX Runtime, loaded with dlopen
# through cgo (github.com/yalue/onnxruntime_go). That is not exec and the
# manifest has no key for it, so it is said here instead -- an application
# registering this module builds with CGO_ENABLED=1 and needs the ONNX Runtime
# shared library on the machine it runs on.
exec = false
# It owns no table.
migrations = false
